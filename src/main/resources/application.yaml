spring:
  application:
    name: media
  config:
    import: optional:file:./application-local.yaml
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

app:
  auth:
    expose-reset-token: false
  security:
    allow-open-access: false
    enable-h2-console: false
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
